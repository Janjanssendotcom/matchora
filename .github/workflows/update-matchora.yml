name: Matchora scheduled refresh
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update timestamp
        run: |
          mkdir -p data
          date -u +%Y-%m-%dT%H:%M:%SZ > data/last-refresh.txt
      - name: Commit refresh marker
        run: |
          git config user.name "matchora-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/last-refresh.txt
          git diff --cached --quiet || (git commit -m "chore: refresh Matchora" && git push)
