<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matchora 2026/27</title><meta name="theme-color" content="#07120c"><style>:root{--b:#07120c;--s:#0d1d13;--s2:#152a1c;--t:#f5fff8;--m:#8fa99b;--l:#274633;--a:#39df88}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:15px system-ui}button,select,input{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{padding:18px;background:var(--s);border-right:1px solid var(--l)}.brand{font-size:24px;font-weight:900;margin-bottom:18px}.brand b{color:var(--a)}.nav{display:grid;gap:6px}.nav button{padding:11px;border:0;border-radius:10px;background:transparent;color:var(--m);text-align:left;font-weight:800}.nav button.active,.nav button:hover{background:var(--s2);color:var(--t)}.side button2{margin-top:8px}.main{padding:22px;max-width:1400px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:15px}.top h1{margin:0}.sel{background:var(--s);border:1px solid var(--l);color:var(--t);padding:10px;border-radius:10px}.hero,.panel,.card{background:var(--s);border:1px solid var(--l);border-radius:18px;padding:17px}.hero{background:linear-gradient(135deg,#123d27,#09170f)}.hero h2{font-size:44px;margin:8px 0}.hero b{color:var(--a)}.muted{color:var(--m);font-size:12px}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.kpi strong{display:block;font-size:22px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tableWrap{overflow:auto}.tbl{width:100%;border-collapse:collapse;min-width:720px}.tbl th,.tbl td{padding:10px;border-bottom:1px solid var(--l);text-align:left}.tbl th{color:var(--m);font-size:11px}.fixture{display:grid;grid-template-columns:90px 1fr 100px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--l);cursor:pointer}.teams{display:grid;gap:4px}.score{text-align:right;font-weight:900}.rounds{display:flex;gap:6px;overflow:auto;margin:8px 0 12px}.rounds button{padding:8px 10px;border:1px solid var(--l);background:var(--s2);color:var(--m);border-radius:9px}.rounds button.active{background:var(--a);color:#062012}.row{display:grid;grid-template-columns:36px 1fr 90px;gap:8px;align-items:center;background:var(--s2);padding:8px;border-radius:10px;margin-bottom:6px}.pos{color:var(--a);font-weight:900}.rating{font-weight:900;color:var(--a)}.toast{display:none;position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:10px 14px;border-radius:10px;background:#173823;border:1px solid #3b875b}.last{color:var(--m);font-size:12px}@media(max-width:850px){.app{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:4;border-right:0;border-bottom:1px solid var(--l);display:flex;gap:8px;overflow:auto}.brand{white-space:nowrap;margin:0 10px 0 0}.nav{display:flex}.nav button{white-space:nowrap}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}.main{padding:12px}.hero h2{font-size:35px}}</style></head><body><div class="app"><aside class="side"><div class="brand">⚽ <b>Matchora</b></div><nav class="nav"><button class="active" data-v="home">Overview</button><button data-v="stand">Standings</button><button data-v="fix">Fixtures</button><button data-v="res">Results</button><button data-v="rat">Ratings</button><button data-v="pred">Predictions</button></nav></aside><main class="main"><div class="top"><div><h1 id="title">Overview</h1><span id="last" class="last"></span></div><select id="league" class="sel"></select></div><section id="home" class="view active"><div class="hero"><div class="muted">2026/27 FOOTBALL HUB</div><h2>Predict.<br><b>Follow. Compare.</b></h2><p>Live standings, complete matchdays, results, match stats, lineups and per-player ratings for the selected competition.</p></div><div class="cards"><div class="card kpi"><strong>10</strong><span class="muted">Competitions</span></div><div class="card kpi"><strong>2026/27</strong><span class="muted">Season</span></div><div class="card kpi"><strong>Live</strong><span class="muted">Data</span></div><div class="card kpi"><strong>0–10</strong><span class="muted">Ratings</span></div></div><div class="grid" id="homeLeague"></div></section><section id="stand" class="view"><div class="panel"><div class="toolbar"><button onclick="loadStand()">↻ Refresh</button></div><div id="standStat" class="muted"></div><div class="tableWrap"><table class="tbl"><thead><tr><th>#</th><th>Team</th><th>MP</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead><tbody id="standBody"></tbody></table></div></div></section><section id="fix" class="view"><div class="panel"><div class="toolbar"><button onclick="loadRounds()">↻ Refresh</button></div><div class="rounds" id="rounds"></div><div id="fixList"></div></div></section><section id="res" class="view"><div class="panel"><div class="toolbar"><button onclick="loadRounds()">↻ Refresh</button></div><div id="resList"></div></div></section><section id="rat" class="view"><div class="panel"><div class="toolbar"><select id="team" class="sel"></select><button onclick="loadTeamRatings()">↻ Refresh</button></div><div id="ratStat" class="muted"></div><div id="ratList"></div></div></section><section id="pred" class="view"><div class="panel"><div class="toolbar"><button onclick="buildPred()">Load 2026/27 teams</button><button onclick="savePred()">Save</button></div><div id="predList"></div></div></section></main></div><div id="toast" class="toast"></div><script>const L=[['Premier League','🇬🇧',17,38],['LaLiga','🇪🇸',8,38],['Serie A','🇮🇹',23,38],['Bundesliga','🇩🇪',35,34],['Ligue 1','🇫🇷',34,34],['Eredivisie','🇳🇱',37,34],['Liga Portugal','🇵🇹',238,34],['Pro League','🇧🇪',38,30],['Trendyol Süper Lig','🇹🇷',52,34],['Stoiximan Super League','🇬🇷',185,26]],API='https://www.sofascore.com/api/v1';let li=0,round=1,season=null,tm=null;const $=x=>document.getElementById(x);const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const ini=x=>String(x||'?').split(/\s+/).slice(0,2).map(a=>a[0]).join('').toUpperCase();async function api(p){const r=await fetch(API+p);if(!r.ok)throw Error(r.status);return r.json()}async function getSeason(){if(season)return season;const d=await api(`/unique-tournament/${L[li][2]}/seasons`);season=d.seasons.find(x=>String(x.year).includes('26/27')||String(x.name).includes('2026/2027')||String(x.name).includes('26/27'))||d.seasons[0];return season}function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1600)}function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.v===v));$('title').textContent={home:'Overview',stand:'Standings',fix:'Fixtures',res:'Results',rat:'Ratings',pred:'Predictions'}[v]||v;if(v==='stand')loadStand();if(v==='fix'||v==='res')loadRounds();if(v==='rat')loadRatingsTeams();if(v==='pred')renderPred()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));$('league').innerHTML=L.map((x,i)=>`<option value="${i}">${x[1]} ${x[0]}</option>`).join('');$('league').onchange=e=>{li=+e.target.value;season=null;loadHome();const a=document.querySelector('.view.active')?.id;if(a==='stand')loadStand();if(a==='fix'||a==='res')loadRounds();if(a==='rat')loadRatingsTeams();if(a==='pred')renderPred()};function loadHome(){$('homeLeague').innerHTML=L.map((x,i)=>`<div class="card"><b>${x[1]} ${esc(x[0])}</b><div class="muted">2026/27</div></div>`).join('')}async function loadStand(){try{const s=await getSeason();const d=await api(`/unique-tournament/${L[li][2]}/season/${s.id}/standings/total`);const rows=d.standings?.[0]?.rows||[];$('standBody').innerHTML=rows.map((r,i)=>`<tr><td>${r.position||i+1}</td><td><b>${esc(r.team?.name)}</b></td><td>${r.matches||0}</td><td>${r.wins||0}</td><td>${r.draws||0}</td><td>${r.losses||0}</td><td>${r.scoresFor||0}</td><td>${r.scoresAgainst||0}</td><td>${(r.scoresFor||0)-(r.scoresAgainst||0)}</td><td><b>${r.points||0}</b></td></tr>`).join('');$('standStat').textContent='Live 2026/27 data';stamp()}catch(e){$('standStat').textContent='Could not load live standings'}}async function loadRounds(){try{const s=await getSeason();$('rounds').innerHTML=Array.from({length:L[li][3]},(_,i)=>`<button class="${i+1===round?'active':''}" onclick="setRound(${i+1})">${i+1}</button>`).join('');const d=await api(`/unique-tournament/${L[li][2]}/season/${s.id}/events/round/${round}`);const ev=d.events||[];$('fixList').innerHTML=ev.map(row).join('');$('resList').innerHTML=ev.filter(x=>x.status?.type==='finished').map(row).join('')||'<div class="muted">No finished matches in this round yet.</div>';stamp()}catch(e){$('fixList').innerHTML='<div class="muted">No data available for this round.</div>';$('resList').innerHTML=''}}function setRound(n){round=n;loadRounds()}function row(e){const h=e.homeTeam?.name||'',a=e.awayTeam?.name||'',st=e.status?.type||'',fin=st==='finished'||st==='inprogress';return `<div class="fixture" onclick="openEvent(${e.id})"><div><b>${new Date((e.startTimestamp||0)*1000).toLocaleDateString(undefined,{day:'2-digit',month:'short'})}</b><div class="muted">${new Date((e.startTimestamp||0)*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div></div><div class="teams"><div>${ini(h)} ${esc(h)}</div><div>${ini(a)} ${esc(a)}</div></div><div class="score">${fin?(e.homeScore?.current??0)+'–'+(e.awayScore?.current??0):'–'}<div class="muted">${st==='finished'?'FT':st==='inprogress'?'LIVE':'UPCOMING'}</div></div></div>`}async function openEvent(id){try{const [e,stats,l]=await Promise.all([api(`/event/${id}`),api(`/event/${id}/statistics`),api(`/event/${id}/lineups`)]);let text=`${e.homeTeam?.name} ${e.homeScore?.current??0}–${e.awayScore?.current??0} ${e.awayTeam?.name}`;let p=[...(l.home?.players||[]),...(l.away?.players||[])].filter(x=>Number(x.statistics?.minutesPlayed)>0).map(x=>`${x.player?.name}: ${x.statistics?.minutesPlayed}' • ${x.statistics?.rating??'—'}`).join('\n');alert(text+'\n\nPlayers with minutes:\n'+p)}catch(e){toast('Match details unavailable')}}async function loadRatingsTeams(){try{const s=await getSeason();const d=await api(`/unique-tournament/${L[li][2]}/season/${s.id}/standings/total`);const rows=d.standings?.[0]?.rows||[];$('team').innerHTML=rows.map(r=>`<option value="${r.team?.id}">${esc(r.team?.name)}</option>`).join('');tm=$('team').value;loadTeamRatings()}catch(e){$('ratStat').textContent='Could not load teams'}}$('team').onchange=()=>{tm=$('team').value;loadTeamRatings()};async function loadTeamRatings(){if(!tm)return;try{const ev=[];for(let p=0;p<4;p++){const d=await api(`/team/${tm}/events/last/${p}`);ev.push(...(d.events||[]));if(!d.hasNextPage)break}const matches=[...new Map(ev.map(e=>[e.id,e])).values()].filter(e=>e.status?.type==='finished').slice(0,30);$('ratList').innerHTML='';for(const e of matches){const l=await api(`/event/${e.id}/lineups`),side=e.homeTeam?.id==tm?'home':'away',ps=(l[side]?.players||[]).filter(x=>Number(x.statistics?.minutesPlayed)>0).sort((a,b)=>(b.statistics.minutesPlayed||0)-(a.statistics.minutesPlayed||0));$('ratList').insertAdjacentHTML('beforeend',`<div class="panel" style="margin-bottom:10px"><b>${e.homeTeam?.name} ${e.homeScore?.current??0}–${e.awayScore?.current??0} ${e.awayTeam?.name}</b><div class="muted">${new Date((e.startTimestamp||0)*1000).toLocaleDateString()}</div>${ps.map(x=>`<div class="row"><div>${ini(x.player?.name)}</div><div>${esc(x.player?.name)}<div class="muted">${x.statistics?.minutesPlayed}' • ${x.statistics?.substitute?'Sub':'Starter'}</div></div><div class="rating">${x.statistics?.rating??'—'}</div></div>`).join('')}</div>`)}$('ratStat').textContent=`${matches.length} finished matches • every player with minutes`;stamp()}catch(e){$('ratStat').textContent='Could not load player ratings'}}function renderPred(){let a=JSON.parse(localStorage.getItem('matchora-pred-'+li)||'[]');$('predList').innerHTML=a.map((x,i)=>`<div class="row"><div class="pos">${i+1}</div><div>${esc(x.name)}</div><input value="${esc(x.points||'')}" placeholder="Points" onchange="setP(${i},this.value)"></div>`).join('')||'<div class="muted">Load the current 2026/27 teams first.</div>'}async function buildPred(){try{const s=await getSeason(),d=await api(`/unique-tournament/${L[li][2]}/season/${s.id}/standings/total`),r=d.standings?.[0]?.rows||[];localStorage.setItem('matchora-pred-'+li,JSON.stringify(r.map(x=>({name:x.team.name,points:''}))));renderPred()}catch(e){toast('Could not load teams')}}function setP(i,v){let a=JSON.parse(localStorage.getItem('matchora-pred-'+li)||'[]');a[i].points=v;localStorage.setItem('matchora-pred-'+li,JSON.stringify(a))}function savePred(){toast('Prediction saved on this device')}function stamp(){$('last').textContent='Updated '+new Date().toLocaleTimeString()}loadHome();setInterval(()=>{const a=document.querySelector('.view.active')?.id;if(a==='stand')loadStand();else if(a==='fix'||a==='res')loadRounds();else if(a==='rat')loadTeamRatings()},15*60*1000);</script></body></html>
